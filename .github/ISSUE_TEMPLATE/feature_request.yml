name: Feature request
description: Suggest something phonex should be able to do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem, not the API you have in mind for it.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: What do you do today instead?
      description: How you work around it now, and why that is not enough.

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: Optional. Signatures only.
      render: go

  - type: checkboxes
    id: upstream
    attributes:
      label: Prior art
      options:
        - label: libphonenumber has this, and I have named the method it corresponds to.
